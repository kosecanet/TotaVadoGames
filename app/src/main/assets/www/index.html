<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TotaVado Games</title>
<style>
@font-face{font-family:Lilita;src:url(fonts/lilita.woff2) format('woff2');font-display:block}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;background:#eef4fb;font-family:Lilita,system-ui,Roboto,sans-serif;color:#fff}
#menu{position:absolute;inset:0;display:flex;flex-direction:column}
#topbar{flex:none;display:flex;align-items:center;gap:10px;padding:12px 12px 10px;background:#d6e9fa}
.sq{width:56px;height:56px;border-radius:16px;border:0;background:#64809a;box-shadow:0 5px 0 #4a6178;display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.sq svg{width:32px;height:32px}
#brand{flex:1;height:56px;border-radius:18px;background:#4d3b5c;box-shadow:0 5px 0 #382a44;display:flex;align-items:center;gap:10px;padding:0 12px;font-size:23px;letter-spacing:.3px;white-space:nowrap;overflow:hidden}
#brand svg{width:40px;height:40px;flex:none;border-radius:9px}
#ages{flex:none;display:flex;gap:8px;padding:0 12px 10px;background:#d6e9fa}
#ages button{flex:1;padding:9px 4px;font-size:15px;border-radius:14px;background:#fff;color:#4d3b5c;box-shadow:0 4px 0 #b9cfe3;white-space:nowrap}
#ages button.on{background:#4d3b5c;color:#fff;box-shadow:0 4px 0 #382a44}
#upd{display:none;flex:none;align-items:center;gap:10px;margin:10px 12px 0;padding:10px 12px;border-radius:16px;background:#43a95b;box-shadow:0 4px 0 #2f7d41;font-size:18px}
#upd span{flex:1}#upd button{padding:9px 14px;font-size:17px;background:#fff;color:#2f7d41;box-shadow:0 3px 0 #cfd8dc}
#grid{flex:1;overflow-y:auto;touch-action:pan-y;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px 12px 120px;align-content:start}
.tile{position:relative;height:calc((100vw - 38px) / 2 * 1.08);max-height:330px;border-radius:26px;border:5px solid var(--b);background:var(--c);overflow:hidden;box-shadow:0 6px 0 rgba(30,40,60,.13)}
.tile:active{transform:translateY(3px) scale(.98)}
.tile .band{position:absolute;inset:-20%;background:linear-gradient(150deg,transparent 52%,rgba(255,255,255,.13) 52%,rgba(255,255,255,.13) 68%,transparent 68%)}
.tile .ic{position:absolute;right:-4%;top:2%;font-size:min(22vw,118px);line-height:1;transform:rotate(-12deg);filter:drop-shadow(4px 5px 0 rgba(0,0,0,.28))}
.tile .t{position:absolute;left:10px;right:6px;bottom:9px;font-size:min(7.2vw,31px);line-height:1;text-transform:uppercase;color:#fff;-webkit-text-stroke:1px rgba(0,0,0,.25);text-shadow:0 3px 0 rgba(0,0,0,.35)}
.tile .solo{position:absolute;left:10px;top:10px;background:#c13fe0;border:3px solid #3a1d48;border-radius:12px;padding:1px 8px;font-size:20px;color:#fff}
.tile .new{position:absolute;left:50%;top:6px;transform:translateX(-50%);background:#2f3a4a;border-radius:10px;padding:3px 9px;font-size:13px;color:#ffe066}
#bottombar{position:absolute;left:0;right:0;bottom:0;height:86px;background:#3d4553;display:flex;align-items:flex-end;justify-content:space-between;padding:0 0 10px}
.pl{position:relative;width:96px;height:118px;margin-bottom:-10px;flex:none}
.pl .hd{position:absolute;left:50%;top:0;width:58px;height:58px;border-radius:50%;transform:translateX(-50%)}
.pl .bd{position:absolute;left:4px;right:4px;bottom:0;height:72px;border-radius:40px 40px 0 0;display:flex;align-items:center;justify-content:center;font-size:36px;padding-top:10px}
.red .hd,.red .bd{background:#ea7a62}.blue .hd,.blue .bd{background:#3f8fd2}
#tourBtn{flex:1;margin:0 6px;height:64px;border-radius:18px;background:#43a95b;box-shadow:0 5px 0 #2f7d41;color:#fff;font-size:21px;line-height:1;border:0;font-family:Lilita}
#game{position:absolute;inset:0;display:none;touch-action:none;background:#000}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#exitBtn{position:absolute;right:-12px;top:50%;margin-top:-48px;width:46px;height:96px;border-radius:18px;background:#fff;color:#1c1c24;font-size:17px;padding:0 0 0 8px;z-index:5;border:0;box-shadow:0 4px 0 rgba(0,0,0,.25)}
#exitBtn span{display:block;transform:rotate(90deg);letter-spacing:1px}
.ov{position:absolute;inset:0;display:none;flex-direction:column;background:rgba(10,15,30,.74);z-index:10}
.half{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:10px;text-align:center}
.top{transform:rotate(180deg)}
.res{font-size:40px;text-shadow:0 3px 0 rgba(0,0,0,.4)}
.msg{font-size:18px;opacity:.9;font-family:system-ui,Roboto,sans-serif;font-weight:700}
.sc{font-size:22px}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
button{font-family:Lilita,system-ui,sans-serif;border:0;border-radius:16px;padding:13px 22px;font-size:20px;background:#43a95b;box-shadow:0 4px 0 #2f7d41;color:#fff}
button.alt{background:#64809a;box-shadow:0 4px 0 #4a6178}
.dlg{align-items:center;justify-content:center}
.box{background:#3d4553;border-radius:24px;padding:22px;text-align:center;display:flex;flex-direction:column;gap:14px;font-size:22px;min-width:260px}
.row{display:flex;justify-content:space-between;align-items:center;gap:20px;font-size:20px}
.tg{width:64px;height:36px;border-radius:18px;background:#64809a;position:relative;box-shadow:none;padding:0}
.tg:after{content:'';position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;transition:left .15s}
.tg.on{background:#43a95b}.tg.on:after{left:32px}
.ver{font-size:13px;opacity:.5;font-family:system-ui}
</style>
</head>
<body>
<div id="menu">
  <div id="topbar">
    <button class="sq" id="setBtn" aria-label="Ajustes"><svg viewBox="0 0 24 24" fill="#fff"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.2h-4l-.4 2.7a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1l.4 2.7h4l.4-2.7c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg></button>
    <div id="brand">
      <svg viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="90" fill="#2b2f36"/><g transform="translate(256 256) scale(.84) translate(-256 -256)"><rect x="63" y="47" width="386" height="418" rx="34" fill="#fff" stroke="#111" stroke-width="14"/><circle cx="256" cy="200" r="128" fill="#d7261e"/><circle cx="256" cy="200" r="100" fill="#1f4ea1"/><rect x="242" y="98" width="28" height="204" fill="#d7261e" transform="rotate(-45 256 200)"/><text x="256" y="402" font-family="Arial,sans-serif" font-weight="900" font-size="82" text-anchor="middle" fill="#111">VADO</text><text x="256" y="446" font-family="Arial,sans-serif" font-weight="700" font-size="32" text-anchor="middle" fill="#111">PERMANENTE</text></g></svg>
      TotaVado Games
    </div>
  </div>
  <div id="ages"><button data-a="1">👶 Menos de 5</button><button data-a="2">🧒 Menos de 10</button><button data-a="3">👨‍👩‍👧 Todos</button></div>
  <div id="upd"><span id="updTxt"></span><button id="updBtn"></button></div>
  <div id="grid"></div>
  <div id="bottombar">
    <div class="pl red"><div class="hd"></div><div class="bd" id="scR">0</div></div>
    <button id="tourBtn">🏆 JUGAR TORNEO 🏆</button>
    <div class="pl blue"><div class="hd"></div><div class="bd" id="scB">0</div></div>
  </div>
</div>

<div id="game">
  <canvas id="cv"></canvas>
  <button id="exitBtn" aria-label="Salir"><span>SALIR</span></button>
</div>

<div class="ov" id="over"><div class="half top" id="ovTop"></div><div class="half" id="ovBot"></div></div>

<div class="ov dlg" id="conf"><div class="box">¿Salir al menú?<div class="btns"><button id="confYes">Sí</button><button class="alt" id="confNo">No</button></div></div></div>

<div class="ov dlg" id="sets"><div class="box">
  <div style="font-size:28px">Ajustes</div>
  <div class="row">Sonido <button class="tg" id="tgSnd"></button></div>
  <div class="row">Vibración <button class="tg" id="tgVib"></button></div>
  <button class="alt" id="resetBtn">Poner marcador a 0</button>
  <button id="setClose">Cerrar</button>
  <div class="ver">TotaVado Games · sin anuncios · <span id="nGames"></span> juegos</div>
</div></div>

<script src="js/engine.js"></script>
<script src="js/games-classic.js"></script>
<script src="js/games-action.js"></script>
<script src="js/games-board.js"></script>
<script src="js/games-p1.js"></script>
<script src="js/games-p2.js"></script>
<script src="js/games-p3.js"></script>
<script src="js/games-p4.js"></script>
<script src="js/games-v2.js"></script>
<script src="js/menu.js"></script>
</body>
</html>
