name: Compilar APK y publicar Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.TV_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # Opcional: si creas el secret TV_KEYSTORE_BASE64 (y sus contraseñas) se firma con tu propia clave
      - name: Preparar clave de firma propia (opcional)
        if: env.KS_B64 != ''
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "TV_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "TV_KEYSTORE_PASSWORD=${{ secrets.TV_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "TV_KEY_ALIAS=${{ secrets.TV_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "TV_KEY_PASSWORD=${{ secrets.TV_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Renombrar APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/TotaVadoGames-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: TotaVadoGames-1.0.${{ github.run_number }}
          path: out/*.apk

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: TotaVado Games 1.0.${{ github.run_number }}
          body: |
            APK listo para instalar en Android (sin anuncios).
            Commit: ${{ github.sha }}
          files: out/*.apk
          make_latest: true
